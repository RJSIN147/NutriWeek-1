<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NutriWeek — Discover healthy, verified meals for busy weekdays. See calories, protein, and fat upfront. Order in seconds." />
  <title>NutriWeek — Healthy meals you can trust</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-navbar" id="app-navbar"></header>

  <main class="page-home">
    <!-- Hero Carousel -->
    <section class="hero-carousel" aria-label="Featured meals">
      <div class="carousel-viewport" id="carousel-viewport"></div>
      <div class="carousel-dots" id="carousel-dots"></div>
    </section>

    <!-- Recommended for You -->
    <section class="rail" aria-labelledby="recommended-title">
      <div class="rail__header">
        <h2 id="recommended-title" class="rail__title">Recommended for You</h2>
        <a href="search.html" class="rail__see-all">See All ›</a>
      </div>
      <div class="rail__scroll" id="recommended-rail"></div>
    </section>

    <!-- Popular Near You -->
    <section class="rail" aria-labelledby="popular-title">
      <div class="rail__header">
        <h2 id="popular-title" class="rail__title">Popular Near You</h2>
      </div>
      <div class="rail__scroll" id="popular-rail"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="site-footer__text">NutriWeek — prototype · Bengaluru</p>
  </footer>

  <script src="data.js"></script>
  <script src="shared.js"></script>
  <script src="home.js"></script>
</body>
</html>
